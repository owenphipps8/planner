name: DailyPlanner
options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  projectFormat: xcode16_0

configs:
  Debug: debug
  Release: release

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 5.0

fileGroups:
  - DailyPlanner/ARCHITECTURE.md
  - DailyPlanner/PlannerWatch
  - DailyPlanner/PlannerWidget

targets:
  DailyPlanner:
    type: application
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: DailyPlanner/App
      - path: DailyPlanner/Managers
      - path: DailyPlanner/Models
      - path: DailyPlanner/ViewModels
      - path: DailyPlanner/Views
      - path: DailyPlanner/Resources
        optional: true
    info:
      path: DailyPlanner/Support/Info.plist
      properties:
        CFBundleDisplayName: DailyPlanner
        LSApplicationCategoryType: public.app-category.productivity
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owenphipps.DailyPlanner
        PRODUCT_NAME: DailyPlanner
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: false